<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>EscalApp · Gimnasio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Icono de marca: el mismo isotipo que el panel y el restaurante (lo genera
       "admin_app-v21/scripts/generar-iconos.mjs"). Rutas SIN barra inicial: se resuelven contra
       el <base href>, que en producción es /gym/. El "?v=2" obliga al navegador a volver a pedirlo. -->
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#191a24">
  <meta name="apple-mobile-web-app-title" content="EscalApp">
  <!-- Inter, la tipografía de la marca (misma carga que admin_app-v21 y restaurante_app).
       Sin esto `--font-family` caía a Segoe UI / San Francisco / Roboto según la máquina. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

  <app-root></app-root>
</body>
</html>
